<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #12151b; color: rgba(220,230,255,0.6);
               font-family: Arial, sans-serif; overflow: hidden; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           text-align: center; font-size: 14px; line-height: 1.6; pointer-events: none; }
  #empty b { color: #dce6ff; font-size: 16px; }
</style>
<script type="module" src="c3d:///model-viewer.min.js"></script>
</head><body>
<model-viewer id="mv" camera-controls autoplay auto-rotate auto-rotate-delay="0" rotation-per-second="20deg"
              shadow-intensity="0.8" shadow-softness="0.9" exposure="1.05" interaction-prompt="none"
              environment-image="neutral" camera-orbit="0deg 75deg 105%"></model-viewer>
<div id="empty"><div><b>Noch keine Figur</b><br>Bild links wählen und „3D-Figur erstellen“ drücken.<br>
Ziehen dreht die Figur, Mausrad zoomt.</div></div>
<script>
  const mv = document.getElementById("mv");
  function show(url) {
    mv.src = url;
    document.getElementById("empty").style.display = "none";
  }
  function clearModel() {
    mv.removeAttribute("src");
    document.getElementById("empty").style.display = "flex";
  }
  function setRotate(on) { on ? mv.setAttribute("auto-rotate", "") : mv.removeAttribute("auto-rotate"); }
</script>
</body></html>
