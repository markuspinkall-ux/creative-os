  <!-- Creative OS 1 „Mighty Mercury“: Die Rakete fliegt zum ersten Planeten, nah an der Sonne -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4def2"/>
      <stop offset="1" stop-color="#d3dbeb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd2a8" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#ffb07a" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ffb07a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffb07a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb3ff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#8fb3ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8fb3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mercury" cx="0.2" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#d9d4cc"/>
      <stop offset="0.35" stop-color="#a9a49c"/>
      <stop offset="0.7" stop-color="#6c6a68"/>
      <stop offset="1" stop-color="rgb(42,45,51)"/>
    </radialGradient>
    <radialGradient id="night" cx="0.85" cy="0.85" r="0.75">
      <stop offset="0" stop-color="rgb(13,16,21)" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="rgb(13,16,21)" stop-opacity="0.35"/>
      <stop offset="1" stop-color="rgb(13,16,21)" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="2900" cy="820" r="520"/></clipPath>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb07a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb07a" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

