label: "Creative-OS-Live"
grub2:
  default: 0
  timeout: 10
  entries:
    - name: "Creative OS ausprobieren und installieren"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Creative-OS-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Creative OS (einfacher Grafikmodus)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Creative-OS-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
