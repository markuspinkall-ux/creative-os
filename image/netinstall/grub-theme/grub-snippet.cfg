### Creative OS: Startmenü im Graphit-Look (fällt auf das Textmenü zurück, wenn etwas fehlt)
# Die ISO selbst suchen (beim UEFI-Start zeigt root sonst auf die kleine EFI-Partition)
if search --no-floppy --set=creative_root --file /boot/grub2/themes/creative/theme.txt; then
    set creative_theme=($creative_root)/boot/grub2/themes/creative
    for m in all_video gfxterm gfxterm_background gfxmenu png; do
        if insmod $m; then
            if [ -n "$creative_debug" ]; then echo "CREATIVE: Modul $m ok"; fi
        else
            if [ -n "$creative_debug" ]; then echo "CREATIVE: Modul $m FEHLT"; fi
        fi
    done
    if loadfont ${creative_theme}/sans-18.pf2; then
        loadfont ${creative_theme}/sans-20.pf2
        loadfont ${creative_theme}/bold-20.pf2
        loadfont ${creative_theme}/bold-36.pf2
        set gfxmode=1280x800,1920x1080,1024x768,auto
        set gfxpayload=keep
        if [ -n "$creative_debug" ]; then
            echo "CREATIVE: gfxmode=$gfxmode prefix=$prefix"
            if insmod videoinfo; then videoinfo; fi
        fi
        if terminal_output gfxterm; then
            if [ -n "$creative_debug" ]; then echo "CREATIVE: gfxterm aktiv"; fi
        else
            # Zweiter Versuch mit der GRUB-eigenen Schrift
            if [ -n "$creative_debug" ]; then echo "CREATIVE: gfxterm mit eigener Schrift fehlgeschlagen, versuche unicode.pf2"; fi
            for f in ${creative_theme}/../../fonts/unicode.pf2 $prefix/fonts/unicode.pf2 ($creative_root)/EFI/BOOT/fonts/unicode.pf2; do
                if loadfont $f; then
                    if [ -n "$creative_debug" ]; then echo "CREATIVE: $f geladen"; fi
                    set gfxterm_font="Unknown Regular 16"
                    break
                fi
            done
            if terminal_output gfxterm; then
                if [ -n "$creative_debug" ]; then echo "CREATIVE: gfxterm aktiv (unicode)"; fi
            elif [ -n "$creative_debug" ]; then echo "CREATIVE: gfxterm geht gar nicht"; fi
        fi
        # Rückfall ohne Thema: wenigstens Hintergrundbild und Graphit-Farben
        background_image -m stretch ${creative_theme}/background.png
        set color_normal=light-gray/black
        set menu_color_normal=light-gray/black
        set menu_color_highlight=black/light-blue
        set theme=${creative_theme}/theme.txt
        export theme
        if [ -n "$creative_debug" ]; then echo "CREATIVE: Schriften geladen, theme=$theme"; sleep 10; fi
    else
        if [ -n "$creative_debug" ]; then echo "CREATIVE: Schrift NICHT ladbar"; sleep 6; fi
    fi
else
    if [ -n "$creative_debug" ]; then echo "CREATIVE: Thema NICHT gefunden"; sleep 6; fi
fi
