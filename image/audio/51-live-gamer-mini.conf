# The analog-stereo profile can capture silence on the Live Gamer MINI.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-.*"
        device.vendor.id = "0x07ca"
        device.product.id = "0x3311"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
]
