### BEGIN creative-os grub-design
# Gibeon OS: Startauswahl im Graphit-Look. Fehlt etwas, bleibt einfach das Textmenü.
# Abschalten: sudo creative-grub-design aus
if [ -f "$prefix/themes/creative/theme.txt" ]; then
    set creative_theme="$prefix/themes/creative"
    # UEFI: Der signierte GRUB bringt Grafik, Menü und PNG schon mit. Module von der Platte
    # nachladen verbietet Secure Boot („prohibited by secure boot policy“) – also nur bei BIOS.
    if [ "$grub_platform" != "efi" ]; then
        insmod all_video
        insmod gfxterm
        insmod gfxmenu
        insmod png
    fi
    if loadfont "$creative_theme/sans-18.pf2"; then
        loadfont "$creative_theme/sans-20.pf2"
        loadfont "$creative_theme/bold-20.pf2"
        loadfont "$creative_theme/bold-36.pf2"
        # UEFI: Auflösung der Firmware übernehmen („auto“ behält den laufenden Modus).
        # Eine fest erzwungene Auflösung ließ bei mehreren/gedrehten Monitoren und
        # NVIDIA den Startbildschirm (Rakete) schwarz.
        if [ "$grub_platform" = "efi" ]; then
            set gfxmode=auto
        else
            set gfxmode=1920x1080,1280x800,1024x768,auto
        fi
        set gfxpayload=keep
        if terminal_output gfxterm; then
            # Hintergrund kommt aus theme.txt (desktop-image) – kein background_image nötig
            set theme="$creative_theme/theme.txt"
            export theme
        fi
    fi
fi
### END creative-os grub-design
