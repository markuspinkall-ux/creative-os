# Creative OS – Anmeldebildschirm
[General]
DisplayServer=wayland
# QML_XHR_ALLOW_FILE_READ: die Server-Modus-Maske liest /var/lib/creative-servermode/state.json
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QML_XHR_ALLOW_FILE_READ=1
InputMethod=

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=creative
CursorTheme=breeze_cursors

[Users]
RememberLastUser=true
RememberLastSession=true
