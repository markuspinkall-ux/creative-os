name: Laufwerke-Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Platte einrichten (Testplatte)
        shell: bash {0}
        run: |
          truncate -s 2G /tmp/disk.img
          dev=$(sudo losetup -fP --show /tmp/disk.img)
          # alte Aufteilung mit zwei Partitionen, eine davon eingehängt
          printf 'label: gpt\n,500M,L\n,,L\n' | sudo sfdisk -q $dev
          sudo mkfs.ext4 -q ${dev}p1 && sudo mkfs.ext4 -q ${dev}p2
          sudo mkdir -p /mnt/alt && sudo mount ${dev}p1 /mnt/alt
          lsblk $dev
          sudo apt-get install -y -qq exfatprogs >/dev/null 2>&1
          systemctl is-active udisks2 || true
          for fs in ext4 exfat ext4; do
            sudo CREATIVE_DRIVES_TEST=1 PKEXEC_UID=1001 python3 drives/creative-drives-helper setup $dev Testplatte $fs; echo "Code $?"
            lsblk -f $dev; findmnt -S ${dev}p1 || true
          done
          tail -3 /etc/fstab
          echo "=== System-Laufwerk muss abgelehnt werden"
          root=$(lsblk -s -n -p -o PATH,TYPE $(findmnt -n -o SOURCE / | cut -d[ -f1) | awk '$2=="disk"{print $1}' | sed 's/[^/a-z0-9]//g' | head -1)
          echo "Systemplatte: $root"
          sudo CREATIVE_DRIVES_TEST=1 python3 drives/creative-drives-helper setup "$root" X ext4; echo "Code $?"
