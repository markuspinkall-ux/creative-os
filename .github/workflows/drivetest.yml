name: Laufwerke-Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'drives/**'
      - 'tests/test_drives_helper.py'
      - 'tests/drives_integration.sh'
      - '.github/workflows/drivetest.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdisk e2fsprogs exfatprogs ntfs-3g
      - name: Systemplattenschutz und Fehlerfälle simulieren
        run: python3 -m unittest discover -s tests -p test_drives_helper.py
      - name: Formatieren und Umbenennen auf einer eigenen Testplatte
        run: bash tests/drives_integration.sh
