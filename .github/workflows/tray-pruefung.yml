name: Tray prüfen
# Deck im Tray (neben Broadcast): Foto der Taskleiste mit verbundenem Stream Deck.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/creative_shell/decktray.py, shell/creative_shell/qml/surfaces/Taskbar.qml, .github/workflows/tray-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt installieren
        timeout-minutes: 10
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-liberation dbus
          pip install -q PySide6 pytest
      - name: Tests
        run: python3 -m pytest -q tests/test_tray_apps.py
      - name: Taskleiste fotografieren
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          set -e
          mkdir -p fotos
          B=$(mktemp -d); for n in creative-deck creative-broadcast; do printf '#!/bin/sh\nexit 0\n' > "$B/$n"; chmod +x "$B/$n"; done
          R=$(mktemp -d); mkdir -p "$R/creative-deck"
          echo '{"geraete": [{"modell": "Stream Deck MK.2"}]}' > "$R/creative-deck/status.json"
          H=$(mktemp -d); mkdir -p "$H/Schreibtisch" "$H/.config/creative-os"; ln -s Schreibtisch "$H/Desktop"
          echo '{"desktopStats": false}' > "$H/.config/creative-os/shell.json"
          foto() {
            (cd "$GITHUB_WORKSPACE/shell" && env PATH="$B:$PATH" XDG_RUNTIME_DIR="$R" CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" \
              HOME="$H" XDG_CONFIG_HOME="$H/.config" CREATIVE_SCREENSHOT_DELAY=4000 PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" \
              CREATIVE_SCREENSHOT="$1" timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 | grep -iE "error|qml|deck" | tail -15) || true
          }
          foto "$GITHUB_WORKSPACE/fotos/tray-graphit.png"
          printf '[Look]\ndesign=porzellan\n' > "$H/.config/creative-os/look.conf"
          foto "$GITHUB_WORKSPACE/fotos/tray-porzellan.png"
          ls -la fotos
          for f in fotos/*.png; do echo "PNG64:$(basename "$f"):$(base64 -w0 "$f")"; done
