name: Creative Deck prüfen
# Stream-Deck-Dienst mit nachgebautem Gerät, OBS-Protokoll, Tastenkürzel – dazu Fotos vom Editor.
on:
  push:
    branches: ["claude/**"]
    paths: [deck/**, tools/deck-test.py, .github/workflows/deck-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deck-pruefung
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Qt und Stream-Deck-Bibliothek installieren
        timeout-minutes: 10
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-liberation libhidapi-libusb0
          pip install -q PySide6 pillow "streamdeck==0.9.8"
      - name: Dienst und Bausteine prüfen
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python3 tools/deck-test.py fotos
      - name: Editor fotografieren
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          H=$(mktemp -d)
          export PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" XDG_RUNTIME_DIR="$H/run" PYTHONPATH="$GITHUB_WORKSPACE/deck"
          cd "$GITHUB_WORKSPACE"
          timeout 60 python3 -m creative_deck --selftest
          CREATIVE_DECK_TASTE=0 timeout 60 python3 -m creative_deck --foto fotos/editor-programm.png
          CREATIVE_DECK_TASTE=12 timeout 60 python3 -m creative_deck --foto fotos/editor-tastenkuerzel.png
          CREATIVE_DECK_TASTE=4 timeout 60 python3 -m creative_deck --foto fotos/editor-seite.png
          ls -la fotos
      - name: Ablegen
        if: always()
        run: |
          [ -d fotos ] || exit 0
          cd fotos && git init -q -b deck-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Fotos ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" deck-fotos
