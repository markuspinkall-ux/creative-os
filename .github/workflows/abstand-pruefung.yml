name: Fensterabstand prüfen
# Creative Abstand in echtem KWin (Fedora 44, virtueller Bildschirm): maximieren → Abstand statt randlos,
# nochmal maximieren → alte Größe.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/kwin/creative-abstand/**, shell/kwin/creative-tasks/**, tools/abstand-test.sh, tools/abstand-client.py, .github/workflows/abstand-pruefung.yml]
  workflow_dispatch:
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: KWin mit Creative Abstand
        timeout-minutes: 15
        run: docker run --rm -v "$PWD:/src" -w /src registry.fedoraproject.org/fedora:44 sh tools/abstand-test.sh
