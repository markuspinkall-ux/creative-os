name: Maximieren prüfen
# Maximieren in echtem KWin (Fedora 44, virtueller Bildschirm): randlos bis zur Taskleiste,
# wiederherstellen → alte Größe; dazu keine Fehler im Skript creative-tasks.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/kwin/kwinrc, shell/kwin/creative-abstand/**, shell/kwin/creative-tasks/**, tools/abstand-test.sh, tools/abstand-client.py, .github/workflows/abstand-pruefung.yml]
  workflow_dispatch:
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: KWin mit Abstand
        timeout-minutes: 15
        run: docker run --rm -v "$PWD:/src" -w /src registry.fedoraproject.org/fedora:44 sh tools/abstand-test.sh
