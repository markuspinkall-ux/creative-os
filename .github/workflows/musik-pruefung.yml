name: Musikgenerator prüfen
on:
  push:
    branches: ["claude/**"]
    paths: [musik/**, tests/test_musik.py, .github/workflows/musik-pruefung.yml]
  workflow_dispatch:
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt und numpy
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-dejavu-core libpulse0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0
          pip install -q PySide6 numpy pytest
      - name: Mischer und Vorschläge
        run: python3 -m pytest -q tests/test_musik.py
      - name: Fenster (Selbsttest und Fotos)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 musik/gibeon-musik --selftest
          mkdir -p fotos
          timeout 60 python3 musik/gibeon-musik --seite=haupt --art=musik --screenshot=fotos/musik.png
          timeout 60 python3 musik/gibeon-musik --seite=haupt --art=atmo --screenshot=fotos/atmo.png
          timeout 60 python3 musik/gibeon-musik --seite=einrichten --screenshot=fotos/einrichten.png
          for f in fotos/*.png; do n=$(basename "$f" .png); base64 -w 0 "$f" | fold -w 3000 | sed "s/^/PNG64:$n:/"; echo; done
