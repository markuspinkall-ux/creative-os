name: Notizen-Widget prüfen
# Modelltest, dann die Shell ohne Bildschirm mit dem Notizen-Widget fotografieren:
# hineinklicken, tippen, prüfen, ob notizen.json den Text enthält – und Creative Widgets fotografieren.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/creative_shell/widget_extras.py, shell/creative_shell/widgets_app.py, shell/creative_shell/dbus_service.py, shell/creative_shell/qml/surfaces/Wallpaper.qml, tools/notizen-test.py, tools/screenshots/**, .github/workflows/notizen-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notizen-pruefung
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt installieren
        timeout-minutes: 10
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-liberation fonts-noto-color-emoji dbus
          pip install -q PySide6
      - name: Modell
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/notizen-test.py
      - name: Shell fotografieren und tippen
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          set -e
          mkdir -p fotos
          H=$(mktemp -d); mkdir -p "$H/Schreibtisch" "$H/.config/creative-os"; ln -s Schreibtisch "$H/Desktop"
          for n in Urlaub.jpg Rechnung.pdf Lied.mp3; do echo x > "$H/Schreibtisch/$n"; done
          cat > "$H/.config/creative-os/shell.json" <<'JSON'
          {"desktopStats": false,
           "desktopExtras": {"notesInstalled": true, "notesEnabled": true, "notesPos": [0.0, 0.0]}}
          JSON
          printf '%s' '{"version": 1, "text": "Einkaufen:\n– Milch\n– Brot\n\nKathrin anrufen 🙂"}' > "$H/.config/creative-os/notizen.json"
          run() {
            (cd "$GITHUB_WORKSPACE/shell" && env CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" \
              CREATIVE_SCREENSHOT_DELAY=4000 PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" "$@" \
              timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 | grep -v "^$" | tail -15) || true
          }
          run CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/notizen.png"
          # ans Ende klicken und weitertippen – nach 0,7 s speichert das Widget von selbst
          run CREATIVE_TEST_TYPE="200,250,\nTest 2026 ok" CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/notizen-getippt.png"
          echo "--- notizen.json:"; cat "$H/.config/creative-os/notizen.json"; echo
          python3 - "$H/.config/creative-os/notizen.json" <<'PY'
          import json, sys
          text = json.load(open(sys.argv[1], encoding="utf-8"))["text"]
          assert "Kathrin anrufen" in text, "alter Text verloren"
          assert "Test 2026 ok" in text, "getippter Text wurde nicht gespeichert"
          print("Getippter Text gespeichert")
          PY
          # Light-Design
          printf '[Look]\ndesign=porzellan\n' > "$H/.config/creative-os/look.conf"
          run CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/notizen-porzellan.png"
          rm "$H/.config/creative-os/look.conf"
          # Creative Widgets (spricht über D-Bus mit der Shell – ohne Shell sind die Schalter aus)
          (cd shell && HOME="$H" XDG_CONFIG_HOME="$H/.config" PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" \
            CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/creative-widgets.png" timeout 40 python3 -m creative_shell.widgets_app 2>&1 | tail -5) || true
          ls -la fotos
      - name: Ablegen
        if: always()
        run: |
          cd fotos && git init -q -b notizen-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Fotos ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" notizen-fotos
