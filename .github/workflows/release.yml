# Freigeben: Die zuletzt gebaute Test-Version wird zur stabilen Version.
# Alle PCs auf dem stabilen Kanal bekommen sie dann als Update.
# Dazu entsteht eine Seite „Orbit OS <Datum>“ mit allen Neuerungen seit der letzten Freigabe.
name: Freigeben
on:
  workflow_dispatch:
    inputs:
      ohne_starttest:
        description: "Auch ohne grünen Starttest freigeben (nur im Notfall)"
        type: boolean
        default: false
permissions:
  packages: write
  contents: write
  actions: read
concurrency:
  group: creative-os-publish
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Schranke – nur Versionen mit bestandenem Starttest
        if: ${{ !inputs.ohne_starttest }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          # zuletzt erfolgreich gebaute Test-Version
          build="$(gh api "repos/$repo/actions/workflows/build.yml/runs?branch=main&status=success&per_page=1" \
                   --jq '.workflow_runs[0] | "\(.head_sha) \(.updated_at)"')"
          sha="${build%% *}"
          [ -n "$sha" ] || { echo "::error::Keine erfolgreich gebaute Test-Version gefunden."; exit 1; }
          # Starttest (VM bootet bis zum Desktop) für genau diese Version
          ok="$(gh api "repos/$repo/actions/workflows/boottest.yml/runs?head_sha=$sha&per_page=20" \
                --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')"
          echo "Test-Version ${sha:0:7}: bestandene Starttests: $ok"
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::Starttest für ${sha:0:7} nicht bestanden (oder läuft noch) – keine Freigabe. Im Notfall „Auch ohne grünen Starttest freigeben“ wählen."
            exit 1
          fi
      - name: Test-Version → stabil
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          img="ghcr.io/${owner}/creative-os"
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          for v in amd nvidia; do
            skopeo copy --all "docker://${img}:${v}-testing" "docker://${img}:${v}"
            echo "freigegeben: ${img}:${v}"
          done
      - name: Was ist neu (Neuerungen seit der letzten Freigabe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date="$(date +%Y.%m.%d)"
          name="$(python3 -c 'import json;d=json.load(open("image/version.json"));print(str(d["nummer"]) + " · " + d["codename"])')"
          tag="version-$(date +%Y%m%d)-${{ github.run_number }}"
          prev="$(git tag --list 'version-*' --sort=-creatordate | head -n1)"
          range="${prev:+$prev..}HEAD"
          {
            echo "## Neu in Orbit OS ${name} (${date})"
            echo
            git log --no-merges --pretty='%s' $range \
              | grep -v '^Werkzeug\|^Probe\|^wip\|^Bauen für' \
              | sed -E 's/ \[(skip ci|freigeben)\]//g; s/^/- /' | head -n 80
            echo
            echo "Update: Systemsteuerung › Software & Updates › Nach Updates suchen."
          } > notes.md
          git tag "$tag" && git push origin "$tag"
          gh release create "$tag" --title "Orbit OS ${name} (${date})" --notes-file notes.md --repo "${{ github.repository }}"
