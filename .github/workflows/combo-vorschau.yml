name: Klapplisten-Vorschau
on:
  push:
    branches: ["claude/3d-combo"]
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q libegl1 libxkbcommon0 fonts-liberation >/dev/null && pip install -q PySide6
      - env: { QT_QPA_PLATFORM: offscreen }
        run: |
          mkdir fotos
          python3 tools/combo-vorschau.py creative3d/creative-3d fotos/3d-combo.png
          python3 tools/combo-vorschau.py cut/creative-cut fotos/cut-combo.png
          cd fotos && git init -q -b combo-fotos && git add . && git -c user.name=bot -c user.email=bot@localhost commit -qm fotos \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" combo-fotos
