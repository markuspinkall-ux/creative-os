name: Tray-Position Vorschau
# Fotografiert die Shell zweimal: Systemtray oben links und Systemtray in der Taskleiste.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/creative_shell/qml/surfaces/TrayIcons.qml, shell/creative_shell/qml/surfaces/Taskbar.qml, shell/creative_shell/qml/surfaces/Topbar.qml, .github/workflows/tray-position-vorschau.yml, tools/tray-vorschau-bild.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt installieren
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-liberation dbus
          pip install -q PySide6 pillow
          echo '{"screens":[{"name":"Bildschirm","x":0,"y":0,"width":1600,"height":900,"logicalDpi":96,"logicalBaseDpi":96,"dpr":1}]}' > /tmp/screens.json
      - name: Shell fotografieren
        env:
          QT_QPA_PLATFORM: "offscreen:configfile=/tmp/screens.json"
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p fotos
          for pos in oben taskleiste; do
            H=$(mktemp -d); mkdir -p "$H/Schreibtisch" "$H/.config/creative-os"
            echo "{\"trayPosition\": \"$pos\", \"desktopStats\": false}" > "$H/.config/creative-os/shell.json"
            cd "$GITHUB_WORKSPACE/shell" && CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" \
              CREATIVE_SCREENSHOT_DELAY=4000 CREATIVE_SCREENSHOT_ALL=1 PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" \
              CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/tray-$pos.png" \
              timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 | grep -iE "error|warn|qml" | tail -20 || true
            python3 "$GITHUB_WORKSPACE/tools/tray-vorschau-bild.py" "$GITHUB_WORKSPACE/fotos/tray-$pos"
          done
          ls -la "$GITHUB_WORKSPACE/fotos"
          test -s "$GITHUB_WORKSPACE/fotos/tray-taskleiste.png"
      - name: Fotos im Branch „tray-fotos“
        if: always()
        run: |
          cd fotos 2>/dev/null || exit 0
          git init -q -b tray-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Tray ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" tray-fotos
