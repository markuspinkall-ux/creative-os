name: Live-ISO testen

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Lauf-ID von „Live-ISO mit Creative-Installation“, dessen ISO getestet wird"
        required: true
      variant:
        type: choice
        options: [amd, nvidia]
        default: amd

permissions:
  contents: write
  actions: read

jobs:
  test:
    name: Live-ISO in der VM installieren und fotografieren
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VARIANT: ${{ inputs.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Platz schaffen und KVM freischalten
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          getent hosts archive.ubuntu.com >/dev/null || { sudo rm -f /etc/resolv.conf; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null; }
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf netpbm socat python3-pil dosfstools >/dev/null
          sudo chmod 666 /dev/kvm
      - name: ISO holen
        uses: actions/download-artifact@v4
        with:
          name: creative-os-${{ inputs.variant }}-live-iso
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: In der VM installieren und fotografieren
        run: ls -lh *.iso && bash tools/live-fotos.sh "$PWD/creative-os-$VARIANT-live.iso"
      - name: Fotos im Branch „live-fotos“ ablegen
        if: always()
        run: |
          cd live-fotos 2>/dev/null || exit 0
          ls *.png >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/pub && cp *.png /tmp/pub/ && cp serial-*.log /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          printf '# Creative OS – Live-ISO-Test\n\nISO aus Lauf %s, Test %s.\n\n![Übersicht](uebersicht.png)\n' \
            "${{ inputs.run_id }}" "${{ github.run_id }}" > README.md
          git init -q -b live-fotos
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Live-Fotos ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-fotos
