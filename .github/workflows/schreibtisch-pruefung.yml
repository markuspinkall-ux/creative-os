name: Schreibtisch prüfen
# Startet die Shell ohne Bildschirm mit Dateien auf dem Schreibtisch und eingeschalteten Widgets
# und fotografiert den Hintergrund: Symbole dürfen nie unter Widgets liegen.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/creative_shell/desktop.py, shell/creative_shell/tasks.py, tools/screenshots/**, shell/creative_shell/__main__.py, shell/creative_shell/qml/surfaces/Wallpaper.qml, tools/schreibtisch-test.py, .github/workflows/schreibtisch-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schreibtisch-pruefung
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt installieren
        timeout-minutes: 10
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-liberation dbus
          pip install -q PySide6
      - name: Plätze speichern (Modell)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/schreibtisch-test.py modell
      - name: Shell fotografieren
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          RENAME_AT: "64,176"
        run: |
          mkdir -p fotos
          H=$(mktemp -d); mkdir -p "$H/Schreibtisch" "$H/.config/creative-os"; ln -s Schreibtisch "$H/Desktop"
          for n in Urlaub.jpg Rechnung.pdf Notizen.txt Lied.mp3 Video.mp4 Tabelle.ods Foto2.png Foto3.png Bericht.odt Archiv.zip Skript.sh; do echo x > "$H/Schreibtisch/$n"; done
          mkdir "$H/Schreibtisch/Projekte"
          cat > "$H/.config/creative-os/shell.json" <<'JSON'
          {"desktopWidgetWeather": {"enabled": true, "x": 0.0, "y": 0.0, "value": ""},
           "desktopWidgetRSS": {"enabled": true, "x": 0.0, "y": 0.55, "value": ""},
           "desktopStats": true}
          JSON
          cd shell && CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" CREATIVE_SCREENSHOT_DELAY=4000 \
            PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/schreibtisch.png" \
            timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 | grep -v "^$" | tail -30 || true
          # Verschieben: das erste Symbol (Spalte 0, Zeile 1 – unter dem Wetter) nach rechts unten ziehen
          cd "$GITHUB_WORKSPACE/shell" && CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" CREATIVE_SCREENSHOT_DELAY=4000 \
            CREATIVE_TEST_DRAG="64,176,690,560" PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/schreibtisch-verschoben.png" \
            timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 | grep -v "^$" | tail -15 || true
          # Umbenennen: Ordner „Projekte“ (verschoben nach rechts unten) anklicken, F2, neuen Namen tippen
          for mode in tippen fertig; do
            extra=""; [ "$mode" = fertig ] && extra=",1"
            cd "$GITHUB_WORKSPACE/shell" && CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" CREATIVE_SCREENSHOT_DELAY=4000 \
              CREATIVE_TEST_RENAME="${RENAME_AT},Spiele 2026${extra}" PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/umbenennen-$mode.png" \
              timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 | grep -v "^$" | tail -8 || true
          done
          echo "--- Schreibtisch nach dem Umbenennen:"; ls "$H/Schreibtisch"
          echo "--- gespeicherte Plätze:"; python3 -c "import json;print(json.load(open('$H/.config/creative-os/shell.json')).get('desktopIconCells'))"
          ls -la "$GITHUB_WORKSPACE/fotos"
      - name: Ablegen
        if: always()
        run: |
          cd fotos && git init -q -b schreibtisch-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Fotos ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" schreibtisch-fotos
