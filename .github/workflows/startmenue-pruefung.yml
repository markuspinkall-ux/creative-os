name: Startmenü prüfen
# Rechtsklick im Startmenü: angeheftete Apps nur in der Taskleiste lösen, Entfernen mit Nachfrage
on:
  push:
    branches: ["claude/**"]
    paths: [shell/creative_shell/qml/surfaces/StartMenu.qml, shell/creative_shell/qml/Creative/**, tools/startmenue-vorschau.py, .github/workflows/startmenue-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt installieren
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-liberation
          pip install -q PySide6
      - name: Startmenü
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: timeout 60 python3 tools/startmenue-vorschau.py fotos
      - name: Ablegen
        if: always()
        run: |
          [ -d fotos ] || exit 0
          cd fotos && git init -q -b startmenue-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Fotos ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" startmenue-fotos
