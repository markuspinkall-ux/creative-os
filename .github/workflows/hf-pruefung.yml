name: TRELLIS-Modelle prüfen
# Prüft, ob alle Modelle, die Creative 3D beim Einrichten lädt, ohne Anmeldung erreichbar sind.
on:
  push:
    branches: ["claude/**"]
    paths: [.github/workflows/hf-pruefung.yml, creative3d/trellis/**]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - run: pip install -q huggingface_hub
      - name: Erreichbarkeit
        shell: python
        run: |
          import json, sys
          from huggingface_hub import hf_hub_download, model_info
          ok = True
          repo = "microsoft/TRELLIS-image-large"
          try:
              info = model_info(repo)
              print("Repo", repo, "gated:", info.gated, "private:", info.private)
          except Exception as e:
              print("Repo-Info FEHLER", repo, type(e).__name__, e)
          try:
              cfg = json.load(open(hf_hub_download(repo, "pipeline.json")))
              print(json.dumps(cfg, indent=1)[:2000])
          except Exception as e:
              print("pipeline.json FEHLER", type(e).__name__, e); sys.exit(1)
          for k, v in cfg["args"]["models"].items():
              for path in (f"{repo}/{v}", v):
                  parts = path.split("/")
                  if len(parts) < 3:
                      continue
                  rid, name = "/".join(parts[:2]), "/".join(parts[2:])
                  try:
                      hf_hub_download(rid, f"{name}.json")
                      print("OK  ", k, rid, name)
                      break
                  except Exception as e:
                      print("FEHL", k, rid, name, type(e).__name__, str(e)[:200])
              else:
                  ok = False
          sys.exit(0 if ok else 1)

  container-probe:
    # Wie auf dem PC: „run.py --prepare“ im echten TRELLIS-Container (ohne Grafikkarte)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: Container laden und Modelle holen
        run: |
          podman pull -q ghcr.io/markuspinkall-ux/creative-trellis:latest
          podman run --rm --entrypoint python3 ghcr.io/markuspinkall-ux/creative-trellis:latest -c \
            "import huggingface_hub, torch; print('huggingface_hub', huggingface_hub.__version__, 'torch', torch.__version__)"
          mkdir -p /tmp/modelle
          podman run --rm -v /tmp/modelle:/cache ghcr.io/markuspinkall-ux/creative-trellis:latest --prepare 2>&1 | tail -40
          podman run --rm -e HF_HUB_VERBOSITY=debug -v /tmp/modelle:/cache --entrypoint python3 \
            ghcr.io/markuspinkall-ux/creative-trellis:latest -c "
          from huggingface_hub import hf_hub_download
          print(hf_hub_download('microsoft/TRELLIS-image-large', 'pipeline.json'))" 2>&1 | tail -30
