name: Secure Boot prüfen
# Start wie auf dem installierten System, mit Secure Boot (shim, signierter GRUB, OVMF mit MS-Schlüsseln)
on:
  push:
    branches: ["claude/**"]
    paths: [image/grub-theme/**, image/quiet-boot/**, tools/secureboot-test.sh, tools/grub-spur.py, .github/workflows/secureboot-pruefung.yml]
  workflow_dispatch:
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: registry.fedoraproject.org/fedora:44
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: SPUR=1 sh tools/secureboot-test.sh secureboot-fotos
      - name: Fotos im Branch „secureboot-fotos“ ablegen
        if: always()
        run: |
          dnf install -y -q git >/dev/null
          cd secureboot-fotos 2>/dev/null || exit 0
          git init -q -b secureboot-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Secure Boot ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" secureboot-fotos
