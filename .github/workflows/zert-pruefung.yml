name: Zertifikat dl.fbaipublicfiles.com prüfen
on:
  push:
    branches: ["claude/dinov2-zert"]
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          pip install -q huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import list_repo_files
          for r in ["fastforks/dinov2"]:
              try:
                  print(r, [f for f in list_repo_files(r) if "vitl14_reg4" in f])
              except Exception as e:
                  print(r, "FEHLER", e)
          PY
          # Original (Zertifikat abgelaufen → nur zum Vergleich ohne Prüfung) und Spiegel vergleichen
          curl -sk -o meta.pth https://dl.fbaipublicfiles.com/dinov2/dinov2_vitl14/dinov2_vitl14_reg4_pretrain.pth
          sha256sum meta.pth; ls -la meta.pth
          for p in dinov2_vitl14_reg4_pretrain.pth dinov2-vitl14-reg/dinov2_vitl14_reg4_pretrain.pth; do
            curl -sSLf -o hf.pth "https://huggingface.co/fastforks/dinov2/resolve/main/$p" && { echo "Spiegel: $p"; sha256sum hf.pth; break; }
          done
