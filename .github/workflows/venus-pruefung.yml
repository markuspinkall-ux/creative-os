name: Vivid Venus prüfen
# Bewegter Hintergrund: echte Shell ohne Bildschirm zweimal fotografieren (nach 4 s und nach 10 s)
# – die Bilder müssen sich unterscheiden (Rakete, Sterne, Wolken). Dazu Graphit und Porzellan.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/creative_shell/qml/surfaces/Wallpaper.qml, shell/creative_shell/qml/Creative/wallpapers*/**, shell/creative_shell/__main__.py, shell/creative_shell/tasks.py, tools/venus-wallpaper.py, image/version.json, .github/workflows/venus-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Qt installieren
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-liberation dbus python3-pil librsvg2-bin
          pip install -q PySide6
      - name: Bilder sind aktuell (Generator = eingecheckte Dateien)
        run: |
          python3 tools/venus-wallpaper.py --creative >/dev/null
          git diff --stat --exit-code -- shell/creative_shell/qml/Creative browser/startpage login shell/lockscreen \
            || { echo "::error::Hintergründe weichen vom Generator ab – tools/venus-wallpaper.py --creative ausführen"; exit 1; }
          python3 -c "import json;d=json.load(open('image/version.json'));assert (d['nummer'],d['codename'],d['kurz'])==(2,'Vivid Venus','venus'),d;print('Version:',d['nummer'],d['codename'])"
      - name: Schreibtisch bewegt sich
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p fotos
          for design in graphit porzellan; do
            for delay in 4000 10000; do
              H=$(mktemp -d); mkdir -p "$H/Schreibtisch" "$H/.config/creative-os"
              echo '{"desktopStats": false, "desktopExtras": {}}' > "$H/.config/creative-os/shell.json"
              [ $design = porzellan ] && printf '[Look]\ndesign=porzellan\n' > "$H/.config/creative-os/look.conf"
              (cd shell && env CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" \
                CREATIVE_SCREENSHOT_DELAY=$delay CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/venus-$design-$delay.png" \
                PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 | grep -iv "^$" | grep -i "qml\|error\|warn" | head -8) || true
            done
          done
          ls -la fotos
          python3 - <<'PY'
          from PIL import Image, ImageChops
          for d in ("graphit", "porzellan"):
              a = Image.open(f"fotos/venus-{d}-4000.png").convert("RGB")
              b = Image.open(f"fotos/venus-{d}-10000.png").convert("RGB")
              diff = ImageChops.difference(a, b).convert("L")
              changed = sum(1 for v in diff.getdata() if v > 6)
              print(d, a.size, "veränderte Bildpunkte:", changed)
              assert changed > 200, f"{d}: Hintergrund bewegt sich nicht"
          print("Vivid Venus bewegt sich")
          PY
      - name: Ablegen
        if: always()
        run: |
          [ -d fotos ] || exit 0
          cd fotos && git init -q -b venus-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Fotos ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" venus-fotos
