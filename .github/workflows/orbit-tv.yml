name: Orbit TV bauen
# Fire-TV-App: APK bauen, im Android-TV-Emulator fotografieren, als Download bereitstellen.
on:
  push:
    branches: ["main", "claude/**"]
    paths: [orbit-tv/**, .github/workflows/orbit-tv.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbit-tv
  cancel-in-progress: false
jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK bauen
        working-directory: orbit-tv
        env:
          ORBIT_TV_VERSION_CODE: ${{ github.run_number }}
          ORBIT_TV_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/OrbitTV.apk"
          ls -la "$GITHUB_WORKSPACE/OrbitTV.apk"
      - name: KVM für den Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Im Android-TV-Emulator fotografieren
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1920x1080
          script: bash orbit-tv/emulator-test.sh
      - name: Fotos ausgeben
        if: always()
        run: |
          for f in fotos/*.png; do [ -f "$f" ] || continue; n=$(basename "$f" .png); base64 -w 0 "$f" | fold -w 3000 | sed "s/^/PNG64:$n:/"; echo; done
          cat fotos/log.txt 2>/dev/null | tail -60 || true
      - name: Zum Herunterladen bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view orbit-tv >/dev/null 2>&1 || gh release create orbit-tv --prerelease --title "Orbit TV (Fire TV)" \
            --notes "Fire-TV-App. Installation mit der App „Downloader“: https://github.com/${{ github.repository }}/releases/download/orbit-tv/OrbitTV.apk"
          gh release upload orbit-tv OrbitTV.apk --clobber
          echo "Download: https://github.com/${{ github.repository }}/releases/download/orbit-tv/OrbitTV.apk"
