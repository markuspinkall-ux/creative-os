name: Creative Engine prüfen
# Spiel-Laufzeit mit echtem Godot testen (Autotest, Bildschirmfotos, Export Linux/Windows).
on:
  push:
    branches: ["claude/**"]
    paths: [engine/**, tools/engine-test.py, .github/workflows/engine-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Godot und Export-Vorlagen
        timeout-minutes: 15
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1 libegl1 libxkbcommon0 libxi6 libxrandr2 \
            libxinerama1 libxcursor1 mesa-utils libgl1-mesa-dri fonts-liberation
          cd /tmp
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          python3 - <<'P'
          import sys; sys.path.insert(0, "${{ github.workspace }}/engine")
          from creative_engine import godot
          print(godot.install_editor("/tmp/Godot_v4.3-stable_linux.x86_64.zip"))
          print(godot.install_templates("/tmp/Godot_v4.3-stable_export_templates.tpz"))
          P
      - name: Testen
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tools/engine-test.py "$HOME/.local/share/creative-engine/godot/Godot_v4.3-stable_linux.x86_64" fotos
      - name: Fotos ablegen
        if: always()
        run: |
          cd fotos 2>/dev/null || exit 0
          git init -q -b engine-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Engine ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" engine-fotos
