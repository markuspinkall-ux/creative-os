name: Creative Art Probelauf
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Krita installieren
        run: dnf install -y -q krita python3-pyqt6 xorg-x11-server-Xvfb gdb mesa-dri-drivers dbus-x11 ImageMagick google-noto-sans-fonts >/dev/null && rpm -q krita python3-pyqt6
      - name: Wie im Abbild einrichten
        run: |
          mkdir -p /usr/share/creative-art /etc/creative-xdg
          cp art/krita/creative-menus.xml /usr/share/creative-art/
          cp art/krita/shortcuts/creative_art.shortcuts /usr/share/krita/shortcuts/
          cp -r art/krita/pykrita/* /usr/share/krita/pykrita/
          cp theme/CreativeGraphit.colors /usr/share/krita/color-schemes/ 2>/dev/null || true
          cp art/kritarc /etc/creative-xdg/kritarc
          install -m755 art/bin/creative-art /usr/bin/creative-art
      - name: Starten (45 s) und Bildschirmfoto
        run: |
          set +e
          mkdir -p /tmp/h/.local/share/krita /tmp/rt shots; chmod 700 /tmp/rt
          # alte, absturzträchtige Menüdatei wie bei einem bestehenden Benutzer
          printf '<!-- Creative Art: Menüleiste -->\n' > /tmp/h/.local/share/krita/krita5.xmlgui
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99 HOME=/tmp/h XDG_RUNTIME_DIR=/tmp/rt XDG_CONFIG_DIRS=/etc/creative-xdg:/etc/xdg LANG=de_DE.UTF-8
          dbus-launch creative-art &
          PID=$!
          sleep 30
          import -window root shots/start.png
          sleep 10
          import -window root shots/spaeter.png
          if ls /proc/*/comm 2>/dev/null | xargs cat 2>/dev/null | grep -qx krita; then echo "=== Krita läuft stabil"; else echo "=== KRITA ABGESTÜRZT"; fi
          ls /tmp/h/.local/share/krita/ | grep -i xmlgui || echo 'keine alte Menüdatei mehr'
          magick shots/spaeter.png -resize 1400x -quality 72 /tmp/s.jpg 2>/dev/null || convert shots/spaeter.png -resize 1400x -quality 72 /tmp/s.jpg
          ls -la shots /tmp/s.jpg; echo BILD-ANFANG; base64 /tmp/s.jpg | sed "s/^/B64:/"; echo BILD-ENDE
          grep -v Fontconfig /tmp/h/.cache/creative-art.log | tail -30
      - uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: shots/
