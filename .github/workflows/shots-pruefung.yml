name: Shots prüfen
# Video-Aufnahme: dieselbe GStreamer-Kette wie beim Desktop-Aufnehmen, nur mit Testbild und
# Testton statt Bildschirmfreigabe – die Datei muss sich sauber beenden und abspielen lassen.
on:
  push:
    branches: ["claude/**"]
    paths: [shots/**, tests/test_shots_aufnahme.py, .github/workflows/shots-pruefung.yml]
  workflow_dispatch:
concurrency:
  group: shots-pruefung-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav ffmpeg
          pip install -q pytest
      - name: Tests
        run: python3 -m pytest -q tests/test_shots_aufnahme.py
      - name: Aufnahme mit Testquellen
        run: |
          cd shots
          python3 -m creative_shots.recorder --selftest /tmp/aufnahme.mp4
          f=$(ls /tmp/aufnahme.* | head -1)
          ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type -of default=nw=1 "$f" | tee /tmp/info.txt
          grep -q "codec_type=video" /tmp/info.txt
          grep -q "codec_type=audio" /tmp/info.txt
          python3 -c "import re,sys; d=float(re.search(r'duration=([0-9.]+)', open('/tmp/info.txt').read()).group(1)); print('Dauer', d); sys.exit(0 if d > 2 else 1)"
