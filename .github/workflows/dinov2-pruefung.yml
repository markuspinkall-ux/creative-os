name: DINOv2 aus timm prüfen
# Vergleicht die aus timm umgewandelten DINOv2-Gewichte mit dem Original von Meta (gleiche Ausgabe?).
on:
  push:
    branches: ["claude/3d-modelle-gpu"]
    paths: [creative3d/dinov2_from_timm.py, .github/workflows/dinov2-pruefung.yml]
  workflow_dispatch:
jobs:
  vergleich:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Platz schaffen
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Umwandeln und vergleichen
        run: |
          podman pull -q ghcr.io/markuspinkall-ux/creative-trellis:latest
          mkdir -p cache/umgewandelt cache/torch
          podman run --rm -v $PWD/creative3d:/app:ro -v $PWD/cache:/cache --entrypoint python3 \
            ghcr.io/markuspinkall-ux/creative-trellis:latest /app/dinov2_from_timm.py /cache/umgewandelt 2>&1 | tail -3
          # Original nur zum Vergleich (Prüfsumme bekannt: 36e4deff…)
          curl -sSfL -o cache/original.pth https://dl.fbaipublicfiles.com/dinov2/dinov2_vitl14/dinov2_vitl14_reg4_pretrain.pth \
            || echo "Original nicht ladbar (Zertifikat?) – Vergleich nur strukturell"
          podman run --rm -e XFORMERS_DISABLED=1 -v $PWD/cache:/cache --entrypoint sh ghcr.io/markuspinkall-ux/creative-trellis:latest -c "pip install -q timm 2>&1 | tail -1; python3 -c \"
          import os, torch, timm
          os.environ['TORCH_HOME'] = '/cache/torch'
          m = torch.hub.load('facebookresearch/dinov2', 'dinov2_vitl14_reg', pretrained=False).eval()
          conv = torch.load('/cache/umgewandelt/dinov2_vitl14_reg4_pretrain.pth', map_location='cpu')
          print('fehlend/zuviel:', m.load_state_dict(conv, strict=True))
          x = torch.randn(1, 3, 518, 518)
          with torch.no_grad():
              a = m.forward_features(x)
          if os.path.exists('/cache/original.pth'):
              orig = torch.load('/cache/original.pth', map_location='cpu')
              m.load_state_dict(orig)
              with torch.no_grad():
                  b = m.forward_features(x)
              for k in ('x_norm_clstoken', 'x_norm_patchtokens', 'x_prenorm'):
                  print(k, 'max. Abweichung', (a[k] - b[k]).abs().max().item())
          # Gegenprobe mit timm (dieselben Gewichte, timm-Aufbau)
          t = timm.create_model('vit_large_patch14_reg4_dinov2.lvd142m', pretrained=True, num_classes=0).eval()
          with torch.no_grad():
              f = t.forward_features(x)
          n = t.num_prefix_tokens
          print('timm: Klassen-Token max. Abweichung', (f[:, 0] - a['x_norm_clstoken']).abs().max().item())
          print('timm: Bildteile    max. Abweichung', (f[:, n:] - a['x_norm_patchtokens']).abs().max().item())
          print('Wertebereich', a['x_norm_patchtokens'].abs().max().item())
          \""
