# Baut Creative OS automatisch auf GitHub (kostenlos für öffentliche Projekte):
#  - bei jeder Änderung und jede Nacht → neues System-Abbild in der GitHub-Registry
#    (installierte PCs holen sich daraus ihre Updates)
#  - ISO-Dateien entstehen separat im Workflow „Installations-ISO erstellen“.
name: Creative OS bauen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"          # jede Nacht: neue Fedora-Updates einbauen
  workflow_dispatch:
    inputs:
      full:
        description: "Vollständigen Systembuild erzwingen"
        type: boolean
        default: false

permissions:
  contents: write        # für die Download-Seite (Releases)
  packages: write

# Builds und Freigaben teilen eine Sperre: kein gegenseitiges Überschreiben.
concurrency:
  group: creative-os-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  image:
    name: Abbild (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nvidia
            nvidia: "1"
          - variant: amd
            nvidia: "0"
    steps:
      - name: Platz schaffen (der Runner ist sonst zu voll)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Namen festlegen
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/creative-os" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Systembasis für das Funktionsupdate prüfen
        id: base
        if: github.event_name != 'schedule' && !inputs.full
        env:
          BASE_TAG: ${{ steps.names.outputs.image }}:${{ matrix.variant }}-app-base
        run: |
          command -v skopeo >/dev/null || sudo apt-get install -y skopeo
          if ! metadata=$(skopeo inspect --no-tags "docker://$BASE_TAG"); then
            echo "Keine Systembasis verfügbar. Vollständiger Build."
            exit 0
          fi
          revision=$(jq -r '.Labels["org.opencontainers.image.revision"] // empty' <<< "$metadata")
          digest=$(jq -r '.Digest' <<< "$metadata")
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             ! git merge-base --is-ancestor "$revision" HEAD; then
            echo "Systembasis kann dem Quellstand nicht zugeordnet werden. Vollständiger Build."
            exit 0
          fi
          git diff --name-only -z "$revision" HEAD > "$RUNNER_TEMP/app-update-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              # Diese beiden Build-Dateien ändern das Grundsystem nicht.
              .github/workflows/build.yml|image/install-app-update.sh) ;;
              art/*|writer/*|podcast/*|settings/creative_settings/*|settings/bin/creative-mariadb-setup|theme/apps/creative-apps-sync) ;;
              *) echo "$path erfordert einen vollständigen Build."; exit 0 ;;
            esac
          done < "$RUNNER_TEMP/app-update-paths"
          echo "image=${BASE_TAG%:*}@$digest" >> "$GITHUB_OUTPUT"

      - name: Creative-Apps auf der vorhandenen Systembasis bauen
        if: steps.base.outputs.image != ''
        env:
          BASE_IMAGE: ${{ steps.base.outputs.image }}
        run: |
          sudo podman build --layers=false \
            --build-arg BASE="$BASE_IMAGE" \
            --label org.opencontainers.image.version=${{ steps.names.outputs.date }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f image/Containerfile.apps \
            -t localhost/creative-os:${{ matrix.variant }}-build .

      - name: Abbild bauen
        if: steps.base.outputs.image == ''
        env:
          MOK_PRIVATE_KEY: ${{ secrets.MOK_PRIVATE_KEY }}
        run: |
          # Signaturschlüssel für Secure Boot nur als Build-Geheimnis (landet nicht im Abbild)
          umask 077
          printf '%s' "$MOK_PRIVATE_KEY" > /tmp/mokkey
          # Zwischenstufen sparen und erst das fertige Dateisystem aufteilen.
          sudo podman build --layers=false --secret id=mokkey,src=/tmp/mokkey \
            --build-arg NVIDIA=${{ matrix.nvidia }} \
            --label org.opencontainers.image.version=${{ steps.names.outputs.date }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f image/Containerfile \
            -t localhost/creative-os:${{ matrix.variant }}-build \
            .

      - name: Creative Art, Writer, ChatGPT und Podcast im fertigen Abbild prüfen
        timeout-minutes: 2
        run: |
          # Ein eigener Job-Schritt zeigt Fehler der Laufzeit und des Programms getrennt vom Abbildbau.
          if sudo podman run --rm --network none --timeout 45 --entrypoint /bin/sh \
            -e QT_QPA_PLATFORM=offscreen -e QT_QUICK_BACKEND=software -e PYTHONFAULTHANDLER=1 \
            "localhost/creative-os:${{ matrix.variant }}-build" -ec '
              XDG_RUNTIME_DIR="$(mktemp -d)"
              export XDG_RUNTIME_DIR HOME="$XDG_RUNTIME_DIR"
              echo "Starte Creative-Art-Selbsttest"
              /usr/bin/creative-art --selftest
              echo "Starte Creative-Writer-Selbsttest"
              /usr/bin/creative-writer --selftest
              echo "Starte Creative-ChatGPT-Selbsttest"
              /usr/bin/creative-chatgpt --selftest
              exec /usr/bin/creative-podcast --selftest
            '; then
            echo "App-Selbsttests bestanden"
          else
            code=$?
            echo "::error::App-Selbsttest oder Podman-Start fehlgeschlagen (Exit-Code $code)."
            df -h / /var/lib/containers
            df -i / /var/lib/containers
            exit "$code"
          fi

      - name: Abbild in wiederverwendbare Schichten aufteilen
        if: steps.base.outputs.image == ''
        run: |
          image="${{ steps.names.outputs.image }}"
          variant="${{ matrix.variant }}"
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:44 \
            /usr/libexec/bootc-base-imagectl rechunk \
            "localhost/creative-os:${variant}-build" "${image}:${variant}-testing"
          sudo podman tag "${image}:${variant}-testing" "${image}:${variant}-${{ steps.names.outputs.date }}"
          sudo podman rmi "localhost/creative-os:${variant}-build"

      - name: Funktionsupdate markieren
        if: steps.base.outputs.image != ''
        run: |
          image="${{ steps.names.outputs.image }}"
          variant="${{ matrix.variant }}"
          sudo podman tag "localhost/creative-os:${variant}-build" "${image}:${variant}-testing"
          sudo podman tag "${image}:${variant}-testing" "${image}:${variant}-${{ steps.names.outputs.date }}"

      - name: Bisherige Manifeste für Größenvergleich sichern
        continue-on-error: true
        run: |
          command -v skopeo >/dev/null || sudo apt-get install -y skopeo
          image="${{ steps.names.outputs.image }}"
          variant="${{ matrix.variant }}"
          for channel in "${variant}-testing" "$variant"; do
            skopeo inspect --raw "docker://${image}:${channel}" > "$RUNNER_TEMP/previous-${channel}.json" || true
          done

      - name: Prüfen, dass main noch diesen Stand enthält
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          test "$current" = "${{ github.sha }}" || { echo "main wurde inzwischen geändert; dieser ältere Bau wird nicht veröffentlicht."; exit 1; }

      - name: In die GitHub-Registry hochladen
        if: github.event_name != 'pull_request'
        env:
          APP_BASE: ${{ steps.base.outputs.image }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Jeder Bau geht zuerst in den Test-Kanal (…-testing). Der stabile Kanal
          # bekommt ihn erst nach der Freigabe (Workflow „Freigeben“) – oder sofort,
          # wenn die Änderung „[freigeben]“ in der Beschreibung trägt.
          command -v skopeo >/dev/null || sudo apt-get install -y skopeo
          image="${{ steps.names.outputs.image }}"
          variant="${{ matrix.variant }}"
          published="$image:$variant-${{ steps.names.outputs.date }}"
          sudo podman push "$published"
          if [ -n "$APP_BASE" ]; then
            sudo skopeo inspect --raw "docker://$APP_BASE" > "$RUNNER_TEMP/base.json"
            sudo skopeo inspect --raw "docker://$published" > "$RUNNER_TEMP/app-update.json"
            python3 - "$RUNNER_TEMP" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          def layers(name):
              manifest = json.loads((Path(sys.argv[1]) / name).read_text())
              return [layer["digest"] for layer in manifest["layers"]]

          base = layers("base.json")
          update = layers("app-update.json")
          if update[:len(base)] != base:
              sys.exit("Funktionsupdate hat Systemschichten ersetzt. Testkanal wurde nicht aktualisiert.")
          PYTHON
          fi
          sudo skopeo copy --preserve-digests "docker://$published" "docker://$image:$variant-testing"
          if [ -z "$APP_BASE" ]; then
            sudo skopeo copy --preserve-digests "docker://$published" "docker://$image:$variant-app-base"
          fi
          if printf '%s' "$COMMIT_MSG" | grep -qF "[freigeben]"; then
            sudo podman tag ${{ steps.names.outputs.image }}:${{ matrix.variant }}-testing ${{ steps.names.outputs.image }}:${{ matrix.variant }}
            sudo podman push ${{ steps.names.outputs.image }}:${{ matrix.variant }}
            echo "Freigegeben für den stabilen Kanal"
          fi

      - name: Voraussichtliche Update-Downloads zusammenfassen
        continue-on-error: true
        run: |
          image="${{ steps.names.outputs.image }}"
          variant="${{ matrix.variant }}"
          sudo skopeo inspect --raw "docker://${image}:${variant}-${{ steps.names.outputs.date }}" > "$RUNNER_TEMP/current.json"
          python3 - "$RUNNER_TEMP" "$variant" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          directory = Path(sys.argv[1])
          variant = sys.argv[2]
          current = json.loads((directory / "current.json").read_text())
          layers = {layer["digest"]: layer["size"] for layer in current["layers"]}
          print(f"### Update-Größe ({variant})")
          print(f"Alle komprimierten Schichten: {sum(layers.values()) / 2**20:.1f} MiB")
          for label, tag in [("Bisheriger Teststand", f"{variant}-testing"), ("Bisheriger Stable-Stand", variant)]:
              try:
                  previous = json.loads((directory / f"previous-{tag}.json").read_text())
                  known = {layer["digest"] for layer in previous["layers"]}
              except (OSError, ValueError, KeyError):
                  print(f"- {label}: Vergleich nicht verfügbar")
                  continue
              missing = sum(size for digest, size in layers.items() if digest not in known)
              print(f"- {label}: {missing / 2**20:.1f} MiB neue Schichten")
          PY
