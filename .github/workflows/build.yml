# Baut Creative OS automatisch auf GitHub (kostenlos für öffentliche Projekte):
#  - bei jeder Änderung und jede Nacht → neues System-Abbild in der GitHub-Registry
#    (installierte PCs holen sich daraus ihre Updates)
#  - auf Knopfdruck (Actions › „Creative OS bauen“ › Run workflow) zusätzlich die
#    Installations-ISO zum Herunterladen
name: Creative OS bauen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"          # jede Nacht: neue Fedora-Updates einbauen
  workflow_dispatch:
    inputs:
      iso:
        description: "Installations-ISO erzeugen"
        type: boolean
        default: true

permissions:
  contents: write        # für die Download-Seite (Releases)
  packages: write

# Builds und Freigaben teilen eine Sperre: kein gegenseitiges Überschreiben.
concurrency:
  group: creative-os-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  image:
    name: Abbild (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nvidia
            nvidia: "1"
          - variant: amd
            nvidia: "0"
    steps:
      - name: Platz schaffen (der Runner ist sonst zu voll)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Namen festlegen
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/creative-os" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Abbild bauen
        env:
          MOK_PRIVATE_KEY: ${{ secrets.MOK_PRIVATE_KEY }}
        run: |
          # Signaturschlüssel für Secure Boot nur als Build-Geheimnis (landet nicht im Abbild)
          umask 077
          printf '%s' "$MOK_PRIVATE_KEY" > /tmp/mokkey
          # --layers=false: nicht nach jedem Schritt eine Zwischenstufe speichern
          # (bei einem mehrere GB großen System kostet das sonst Minuten pro Schritt)
          sudo podman build --layers=false --secret id=mokkey,src=/tmp/mokkey \
            --build-arg NVIDIA=${{ matrix.nvidia }} \
            --label org.opencontainers.image.version=${{ steps.names.outputs.date }} \
            -f image/Containerfile \
            -t ${{ steps.names.outputs.image }}:${{ matrix.variant }}-testing \
            -t ${{ steps.names.outputs.image }}:${{ matrix.variant }}-${{ steps.names.outputs.date }} \
            .

      - name: Prüfen, dass main noch diesen Stand enthält
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          test "$current" = "${{ github.sha }}" || { echo "main wurde inzwischen geändert; dieser ältere Bau wird nicht veröffentlicht."; exit 1; }

      - name: In die GitHub-Registry hochladen
        if: github.event_name != 'pull_request'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Jeder Bau geht zuerst in den Test-Kanal (…-testing). Der stabile Kanal
          # bekommt ihn erst nach der Freigabe (Workflow „Freigeben“) – oder sofort,
          # wenn die Änderung „[freigeben]“ in der Beschreibung trägt.
          sudo podman push ${{ steps.names.outputs.image }}:${{ matrix.variant }}-testing
          sudo podman push ${{ steps.names.outputs.image }}:${{ matrix.variant }}-${{ steps.names.outputs.date }}
          if printf '%s' "$COMMIT_MSG" | grep -qF "[freigeben]"; then
            sudo podman tag ${{ steps.names.outputs.image }}:${{ matrix.variant }}-testing ${{ steps.names.outputs.image }}:${{ matrix.variant }}
            sudo podman push ${{ steps.names.outputs.image }}:${{ matrix.variant }}
            echo "Freigegeben für den stabilen Kanal"
          fi

      - name: Installations-ISO erzeugen
        if: (github.event_name == 'workflow_dispatch' && inputs.iso) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[iso]'))
        run: |
          mkdir -p output
          cat > output/config.toml <<'TOML'
          [customizations.installer.kickstart]
          contents = '''
          lang de_DE.UTF-8
          keyboard de
          timezone Europe/Berlin
          network --hostname=creative-os

          %post
          # --- Creative OS: Nacharbeiten nach der Installation (Kickstart %post) ---
          # 1) Secure Boot: Schlüssel der Creative-OS-Treiber zur Freischaltung vormerken.
          #    Beim nächsten Start fragt ein blauer Bildschirm danach – Passwort: creative
          if [ -d /sys/firmware/efi ] && mokutil --sb-state 2>/dev/null | grep -qi enabled; then
              printf 'creative\ncreative\n' | mokutil --import /usr/share/creative-os/secureboot/creative-os-mok.der || true
          fi
          # 2) Eintrag im Startmenü des PCs (UEFI): „Creative OS“ statt „Fedora“
          if [ -d /sys/firmware/efi ] && command -v efibootmgr >/dev/null 2>&1; then
              num=$(efibootmgr 2>/dev/null | grep -E '^Boot[0-9A-F]{4}\*? +Fedora' | head -1 | sed -E 's/^Boot([0-9A-F]{4}).*/\1/')
              esp=$(findmnt -n -o SOURCE /boot/efi 2>/dev/null)
              [ -n "$esp" ] || esp=$(lsblk -lnpo NAME,PARTTYPE | awk 'tolower($2)=="c12a7328-f81f-11d2-ba4b-00a0c93ec93b"{print $1; exit}')
              if [ -n "$num" ] && [ -n "$esp" ]; then
                  disk="/dev/$(lsblk -no PKNAME "$esp" | head -1)"
                  part=$(cat "/sys/class/block/$(basename "$esp")/partition" 2>/dev/null)
                  loader='\EFI\fedora\shimx64.efi'
                  if [ -b "$disk" ] && [ -n "$part" ] && efibootmgr -q -c -d "$disk" -p "$part" -L "Creative OS" -l "$loader"; then
                      efibootmgr -q -b "$num" -B || true
                  fi
              fi
          fi
          %end
          '''
          TOML
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v ./output/config.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs \
            --target-arch amd64 \
            ${{ steps.names.outputs.image }}:${{ matrix.variant }}-testing
          sudo mv output/bootiso/install.iso "creative-os-${{ matrix.variant }}-${{ steps.names.outputs.date }}.iso"
          ls -lh *.iso

      - name: ISO zum Herunterladen bereitstellen
        if: (github.event_name == 'workflow_dispatch' && inputs.iso) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[iso]'))
        uses: actions/upload-artifact@v4
        with:
          name: creative-os-${{ matrix.variant }}-iso
          path: creative-os-*.iso
          retention-days: 7
          compression-level: 0

  # Kleine Installations-ISO (unter 1 GB): startet den Installer, das System
  # selbst kommt während der Installation schnell aus der GitHub-Registry.
  # Liegt danach als schneller Download unter „Releases“.
  netinstall:
    name: Kleine Installations-ISO
    needs: image
    if: (github.event_name == 'workflow_dispatch' && inputs.iso) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[iso]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ISOs bauen
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          date="$(date +%Y%m%d)"
          mkdir -p out
          for v in amd nvidia; do
            sed "s|@IMAGE@|ghcr.io/${owner}/creative-os:${v}|" image/netinstall/creative.ks.in > "out/creative-${v}.ks"
          done
          sudo podman run --rm --privileged -v "$PWD/out:/out" -v "$PWD:/src:ro" registry.fedoraproject.org/fedora:44 bash -euxc '
            dnf install -y --setopt=install_weak_deps=False lorax xorriso curl cpio gzip mtools >/dev/null
            base=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/iso
            iso=$(curl -fsSL "$base/" | grep -o "Fedora-Everything-netinst-x86_64-[0-9.-]*\.iso" | head -n1)
            curl -fsSL -o /tmp/netinst.iso "$base/$iso"
            for v in amd nvidia; do
              bash /src/image/netinstall/brand-iso.sh /tmp/netinst.iso "/out/creative-$v.ks" "/out/creative-os-$v-netinstall.iso" \
                || mkksiso --ks "/out/creative-$v.ks" /tmp/netinst.iso "/out/creative-os-$v-netinstall.iso"
            done
          '
          sudo chown -R "$USER" out
          for v in amd nvidia; do mv "out/creative-os-$v-netinstall.iso" "creative-os-$v-netinstall-$date.iso"; done
          ls -lh *.iso
          echo "DATE=$date" >> "$GITHUB_ENV"
      - name: Als Download veröffentlichen (Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="iso-${DATE}-${{ github.run_number }}"
          gh release create "$tag" creative-os-*-netinstall-*.iso \
            --repo "${{ github.repository }}" \
            --title "Creative OS – Installation ${DATE}" \
            --notes "Kleine Installations-ISOs. Während der Installation wird Creative OS aus dem Internet geladen – eine Internetverbindung ist nötig.
          - **creative-os-amd-netinstall** – für AMD- oder Intel-Grafik (und für VirtualBox)
          - **creative-os-nvidia-netinstall** – für NVIDIA-Grafikkarten"

