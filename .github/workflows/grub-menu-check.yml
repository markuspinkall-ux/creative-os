name: Isolierter GRUB-Menütest

on:
  push:
    branches: [grub-preview/uefi-test]

permissions:
  contents: read

jobs:
  uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Testwerkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends grub-efi-amd64-bin grub-common qemu-system-x86 ovmf mtools
      - name: Countdown, manuelle Auswahl und Textmodus in QEMU prüfen
        run: python3 tools/grub-menu-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grub-menu-preview
          path: grub-test-results/
          retention-days: 7
