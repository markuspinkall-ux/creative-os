name: Browser prüfen
# Electron mit H.264: Testvideo (H.264/AAC) muss flüssig laufen, Oberfläche wird bedient und fotografiert.
on:
  push:
    branches: ["claude/**"]
    paths: [webbrowser/**, tests/browser_funktionen_test.js, browser/startpage/**, shell/webapps/**, .github/workflows/browser-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: browser-pruefung
  cancel-in-progress: false
env:
  ELECTRON_VERSION: "45.3.1"
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge und Electron holen
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q -o Dpkg::Use-Pty=0 xvfb x11-utils ffmpeg fonts-liberation python3-pil libgtk-3-0 libnss3 libasound2t64 libgbm1
          mkdir -p /tmp/el && cd /tmp/el && npm init -y >/dev/null
          npm install --no-audit --no-fund --foreground-scripts "electron@${ELECTRON_VERSION}"
          [ -x node_modules/electron/dist/electron ] || node node_modules/electron/install.js
          ls node_modules/electron/dist | head
          /tmp/el/node_modules/electron/dist/electron --no-sandbox --version
          node -e "for (const f of ['store.js','selftest.js','preload-ui.js','ui/ui.js','whatsapp/selftest.js','whatsapp/settings.js','whatsapp/wa-preload.js','discord/selftest.js','discord/dc-preload.js','preload-videoad.js','adblock.js','passwords.js','preload-pass.js','page-tools.js','import-bookmarks.js']) new Function(require('fs').readFileSync('webbrowser/app/'+f,'utf8').replace(/^'use strict';/,''))" 2>&1 | head -5 || true
      - name: Lesezeichen-Import, Ordner und Passwörter (ohne Electron)
        run: node tests/browser_funktionen_test.js
      - name: Wie im Abbild verpacken (App als resources/app, ohne default_app.asar)
        run: |
          cp -a /tmp/el/node_modules/electron/dist /tmp/pkg
          rm -f /tmp/pkg/resources/default_app.asar
          cp -a webbrowser/app /tmp/pkg/resources/app
          # Abhängigkeiten (Werbeblocker) genau wie im Abbild aus package-lock.json
          (cd /tmp/pkg/resources/app && npm ci --omit=dev --no-audit --no-fund --ignore-scripts && npm ls --omit=dev --depth=0)
          mkdir -p /tmp/browser && cp -a browser/startpage /tmp/browser/startpage
          ELECTRON_RUN_AS_NODE=1 /tmp/pkg/electron -e "console.log('Electron', process.versions.electron)"
      - name: H.264-Testvideo bauen
        run: |
          mkdir -p /tmp/video
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 20 \
            -c:v libx264 -profile:v high -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/video/h264.mp4
          printf '<!doctype html><title>H.264-Test</title><body style="margin:0;background:#000"><video src="h264.mp4" autoplay muted loop playsinline style="width:100%%"></video>' > /tmp/video/h264.html
      - name: Browser prüfen
        env:
          CREATIVE_WERBETEST_HOST: werbetest.creativeos.de
        run: |
          echo "127.0.0.1 werbetest.creativeos.de" | sudo tee -a /etc/hosts
          set +e
          xvfb-run -a -s "-screen 0 1600x1000x24" sh -c '
            timeout 300 /tmp/pkg/electron --no-sandbox \
              --creative-selftest=$PWD/fotos --creative-video=file:///tmp/video/h264.html --creative-online &
            pid=$!
            sleep 6
            for w in $(xwininfo -root -children | awk "/0x/{print \$1}"); do xprop -id $w WM_CLASS 2>/dev/null | grep -v "not found"; done | sort -u
            wait $pid
          '
          echo "exit=$?" | tee /tmp/exit
          grep -q "exit=0" /tmp/exit
      - name: WhatsApp prüfen (echtes WhatsApp Web, Anmeldeseite)
        run: |
          mkdir -p fotos
          H=$(mktemp -d)
          set +e
          xvfb-run -a -s "-screen 0 1600x1000x24" sh -c '
            HOME='"$H"' XDG_CONFIG_HOME='"$H"'/.config timeout 200 /tmp/pkg/electron --no-sandbox --class=creative-whatsapp --whatsapp \
              --creative-selftest=$PWD/fotos &
            pid=$!
            sleep 8
            for w in $(xwininfo -root -children | awk "/0x/{print \$1}"); do xprop -id $w WM_CLASS 2>/dev/null; done | grep creative-whatsapp | sort -u
            wait $pid
          '
          echo "exit=$?" | tee /tmp/exit-wa
          ls "$H/.config/creative-browser/apps/whatsapp" | head
          grep -q "exit=0" /tmp/exit-wa
      - name: Discord prüfen (echtes Discord Web im Gibeon-Look, Anmeldeseite)
        run: |
          mkdir -p fotos
          H=$(mktemp -d)
          set +e
          xvfb-run -a -s "-screen 0 1600x1000x24" sh -c '
            HOME='"$H"' XDG_CONFIG_HOME='"$H"'/.config timeout 200 /tmp/pkg/electron --no-sandbox --class=discord --discord \
              --creative-selftest=$PWD/fotos
          '
          echo "exit=$?" | tee /tmp/exit-dc
          grep -q "exit=0" /tmp/exit-dc
      - name: Normaler erster Start (frischer Benutzer, mit Einzel-Instanz-Sperre)
        run: |
          H=$(mktemp -d)
          xvfb-run -a -s "-screen 0 1600x1000x24" sh -c '
            HOME='"$H"' XDG_CONFIG_HOME='"$H"'/.config timeout 40 /tmp/pkg/electron --no-sandbox --class=creative-browser &
            pid=$!
            sleep 10
            if kill -0 $pid 2>/dev/null; then echo "läuft nach 10 s"; else echo "FEHLER: beendet sich sofort"; exit 1; fi
            n=$(for w in $(xwininfo -root -children | awk "/0x/{print \$1}"); do xprop -id $w WM_CLASS 2>/dev/null; done | grep -c creative-browser)
            echo "Fenster: $n"
            # zweiter Start: übergibt an das erste Fenster und beendet sich
            HOME='"$H"' XDG_CONFIG_HOME='"$H"'/.config timeout 20 /tmp/pkg/electron --no-sandbox https://example.org
            kill $pid
            [ "$n" -ge 1 ] || { echo "FEHLER: kein Fenster"; exit 1; }
            # Web-App (wie WhatsApp): eigenes Fenster, eigene Fensterklasse, eigene Anmeldedaten
            HOME='"$H"' XDG_CONFIG_HOME='"$H"'/.config timeout 40 /tmp/pkg/electron --no-sandbox --class=creative-whatsapp --app=https://example.org/ --app-name=whatsapp &
            pid=$!
            sleep 10
            kill -0 $pid 2>/dev/null || { echo "FEHLER: Web-App beendet sich sofort"; exit 1; }
            m=$(for w in $(xwininfo -root -children | awk "/0x/{print \$1}"); do xprop -id $w WM_CLASS 2>/dev/null; done | grep -c creative-whatsapp)
            echo "Web-App-Fenster: $m"; ls '"$H"'/.config/creative-browser/apps/
            kill $pid
            [ "$m" -ge 1 ] && [ -d '"$H"'/.config/creative-browser/apps/whatsapp ] || { echo "FEHLER: Web-App"; exit 1; }
          '
      - name: Fotos zusammensetzen
        if: always()
        run: |
          [ -d fotos ] || exit 0
          python3 - <<'PY'
          import glob, json, os
          from PIL import Image
          r = json.load(open("fotos/ergebnis.json")) if os.path.exists("fotos/ergebnis.json") else {}
          h = (r.get("layout") or {}).get("chromeH", 84)
          for ui in sorted(glob.glob("fotos/*-ui.png")):
              name = ui[:-7]
              page = name + "-seite.png"
              u = Image.open(ui).convert("RGBA")
              if os.path.exists(page):
                  p = Image.open(page).convert("RGBA")
                  canvas = Image.new("RGBA", (max(u.width, p.width), max(u.height, h + p.height)), (18, 21, 27, 255))
                  canvas.paste(p, (0, h))
                  canvas.alpha_composite(u, (0, 0))
              else:
                  canvas = u
              canvas.convert("RGB").save(name + ".png")
              print("Foto:", name + ".png")
          PY
      - name: Ablegen
        if: always()
        run: |
          [ -d fotos ] || exit 0
          cd fotos && git init -q -b browser-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Fotos ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" browser-fotos
