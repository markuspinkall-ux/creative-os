# Starttest: Jede neue Test-Version startet einmal in einer virtuellen Maschine.
# Geprüft wird, ob Anmeldung, Oberfläche (Taskleiste) und Benachrichtigungen wirklich laufen.
# Ein Bildschirmfoto vom fertigen Desktop liegt danach beim Lauf (Artefakt „starttest“).
name: Starttest
on:
  workflow_run:
    workflows: ["Creative OS bauen"]
    types: [completed]
  workflow_dispatch:
permissions:
  packages: read
jobs:
  boot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Platz schaffen und KVM freischalten
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf netpbm >/dev/null
          ls -la /dev/kvm
      - name: Testabbild als virtuelle Festplatte bauen
        run: bash tools/boottest.sh build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Starten und prüfen
        run: bash tools/boottest.sh run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starttest
          path: |
            boottest/*.png
            boottest/*.log
          retention-days: 7
