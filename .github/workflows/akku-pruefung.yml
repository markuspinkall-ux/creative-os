name: Akku prüfen
# Akku-Anzeige für Laptops: Werte aus nachgebautem /sys/class/power_supply, Warnungen, Fotos vom Widget.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/creative_shell/akku.py, shell/creative_shell/widget_extras.py, shell/creative_shell/widgets_app.py, shell/creative_shell/qml/surfaces/Wallpaper.qml,
            shell/creative_shell/qml/surfaces/Taskbar.qml, shell/creative_shell/qml/Creative/BatteryGlyph.qml,
            tools/akku-test.py, .github/workflows/akku-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt installieren
        timeout-minutes: 10
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 fonts-liberation fonts-noto-color-emoji dbus
          pip install -q PySide6
      - name: Werte und Warnungen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/akku-test.py /tmp/akku-laptop
      - name: Shell mit Laptop-Akku fotografieren
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          set -e
          mkdir -p fotos
          H=$(mktemp -d); mkdir -p "$H/Schreibtisch" "$H/.config/creative-os"; ln -s Schreibtisch "$H/Desktop"
          echo '{"desktopStats": false, "desktopExtras": {"akkuInstalled": true, "akkuEnabled": true, "akkuPos": [0.5, 0.3]}}' > "$H/.config/creative-os/shell.json"
          run() {
            (cd "$GITHUB_WORKSPACE/shell" && env CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" \
              CREATIVE_POWER_SUPPLY=/tmp/akku-laptop CREATIVE_SCREENSHOT_DELAY=4000 PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" "$@" \
              timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 | grep -v "^$" | tail -15) || true
          }
          run CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/akku-entlaedt.png"
          B=/tmp/akku-laptop/BAT0
          echo Charging > $B/status; echo 1 > /tmp/akku-laptop/AC/online; echo 26000000 > $B/power_now
          run CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/akku-laedt.png"
          echo Discharging > $B/status; echo 0 > /tmp/akku-laptop/AC/online; echo 6500000 > $B/energy_now; echo 9000000 > $B/power_now
          printf '[Look]\ndesign=porzellan\n' > "$H/.config/creative-os/look.conf"
          run CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/akku-schwach-porzellan.png"
          # Desktop-PC ohne Akku: Widget darf nicht erscheinen
          rm "$H/.config/creative-os/look.conf"
          (cd "$GITHUB_WORKSPACE/shell" && env CREATIVE_TEST_BACKGROUND=1 PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" \
            CREATIVE_POWER_SUPPLY=/tmp/kein-akku CREATIVE_SCREENSHOT_DELAY=4000 PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" \
            CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/ohne-akku.png" timeout 60 dbus-run-session -- python3 -m creative_shell --dev 2>&1 \
            | grep -iE "error|qml|akku" | grep -v "^$" | tail -15) || true
          # Creative Widgets: Katalog mit „Akku“
          cat > /tmp/zusammen.sh <<'SH'
          cd "$GITHUB_WORKSPACE/shell"
          CREATIVE_TEST_BACKGROUND=1 timeout 50 python3 -m creative_shell --dev >/tmp/shell.log 2>&1 &
          sleep 8
          PYTHONPATH="$GITHUB_WORKSPACE/tools/screenshots" CREATIVE_SCREENSHOT_SCROLL=1 CREATIVE_SCREENSHOT="$GITHUB_WORKSPACE/fotos/widget-katalog.png" \
            timeout 30 python3 -m creative_shell.widgets_app 2>&1 | tail -5
          kill %1 2>/dev/null; true
          SH
          PYTHONUSERBASE="$HOME/.local" HOME="$H" XDG_CONFIG_HOME="$H/.config" timeout 70 dbus-run-session -- sh /tmp/zusammen.sh || true
          ls -la fotos
          for f in akku-entlaedt akku-laedt akku-schwach-porzellan ohne-akku; do test -s fotos/$f.png || { echo "Foto $f fehlt"; exit 1; }; done
      - name: Ablegen
        if: always()
        run: |
          cd fotos && git init -q -b akku-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Fotos ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" akku-fotos
