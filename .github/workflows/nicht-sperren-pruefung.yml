name: Nicht sperren prüfen
# Schnellzugriff › „Nicht sperren“ hält die Sperre bei org.freedesktop.ScreenSaver und gibt sie wieder frei.
on:
  push:
    branches: ["claude/**"]
    paths: [shell/creative_shell/session.py, shell/creative_shell/qml/surfaces/QuickPanel.qml, tools/schnellzugriff-vorschau.py, tools/nicht-sperren-test.py, .github/workflows/nicht-sperren-pruefung.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt installieren
        timeout-minutes: 10
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon0 libegl1 libgl1 dbus fonts-liberation
          pip install -q PySide6
      - name: Prüfen
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONUSERBASE="$HOME/.local" HOME=$(mktemp -d) timeout 60 dbus-run-session -- python3 tools/nicht-sperren-test.py
      - name: Schnellzugriff fotografieren
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p fotos
          python3 tools/schnellzugriff-vorschau.py fotos/schnellzugriff-aus.png aus
          python3 tools/schnellzugriff-vorschau.py fotos/schnellzugriff-an.png an
      - name: Ablegen
        if: always()
        run: |
          [ -d fotos ] || exit 0
          cd fotos && git init -q -b schnellzugriff-fotos && git add . \
            && git -c user.name=bot -c user.email=bot@localhost commit -qm "Fotos ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" schnellzugriff-fotos
