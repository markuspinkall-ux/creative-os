<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Umfrage</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Inter", "Noto Sans", "Liberation Sans", sans-serif; color: #eef2fb; }
  .umfrage {
    box-sizing: border-box; margin: 12px; padding: 22px 24px 18px; border-radius: 26px;
    background: rgba(22, 26, 36, 0.78); border: 1px solid rgba(255,255,255,0.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 18px 50px rgba(0,0,0,0.35);
    backdrop-filter: blur(18px);
    opacity: 0; transform: translateY(12px) scale(0.98); transition: opacity .35s, transform .35s;
  }
  .umfrage.sichtbar { opacity: 1; transform: none; }
  .frage { font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: 16px; }
  .antwort { position: relative; margin: 10px 0; padding: 12px 14px; border-radius: 16px; overflow: hidden;
             background: rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px; font-size: 20px; }
  .fuellung { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(143,179,255,0.35);
              transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .nummer { position: relative; width: 30px; height: 30px; border-radius: 15px; flex: none; display: flex;
            align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
            background: #8fb3ff; color: #12151b; }
  .text { position: relative; flex: 1; }
  .prozent { position: relative; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gewinner .fuellung { background: rgba(143,179,255,0.6); }
  .ergebnis .gewinner { box-shadow: inset 0 0 0 2px #8fb3ff; }
  .zeit { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; color: #b9c3d8; }
  .zeitbalken { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .zeitbalken > div { height: 100%; background: #8fb3ff; transition: width 1s linear; }
  .hinweis { margin-top: 8px; font-size: 15px; color: #b9c3d8; }
</style>
<style id="eigen"></style>
</head>
<body>
<div class="umfrage" id="u">
  <div class="frage" id="frage"></div>
  <div id="antworten"></div>
  <div class="zeit" id="zeit"><span id="zeittext"></span><div class="zeitbalken"><div id="zb"></div></div></div>
  <div class="hinweis" id="hinweis"></div>
</div>
<script>
  // Studio ruft gibeonUmfrage(zustand, css) auf, sobald sich etwas ändert
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  window.gibeonUmfrage = function (s, css) {
    document.getElementById("eigen").textContent = css || "";
    const u = document.getElementById("u");
    const sichtbar = s && (s.phase === "laeuft" || s.phase === "ergebnis");
    u.classList.toggle("sichtbar", !!sichtbar);
    if (!s || !s.options) return;
    u.classList.toggle("ergebnis", s.phase === "ergebnis");
    document.getElementById("frage").textContent = s.question;
    const box = document.getElementById("antworten");
    while (box.children.length > s.options.length) box.lastChild.remove();
    s.options.forEach((o, i) => {
      let a = box.children[i];
      if (!a) {
        a = el("div", "antwort");
        a.append(el("div", "fuellung"), el("span", "nummer", String(i + 1)), el("span", "text"), el("span", "prozent"));
        box.append(a);
      }
      a.classList.toggle("gewinner", !!o.lead);
      a.querySelector(".fuellung").style.width = o.pct + "%";
      a.querySelector(".text").textContent = o.text;
      a.querySelector(".prozent").textContent = o.pct + " %";
    });
    const laeuft = s.phase === "laeuft";
    document.getElementById("zeit").style.display = laeuft ? "" : "none";
    const m = Math.floor(s.remaining / 60), sec = String(s.remaining % 60).padStart(2, "0");
    document.getElementById("zeittext").textContent = m + ":" + sec;
    document.getElementById("zb").style.width = (s.duration ? 100 * s.remaining / s.duration : 0) + "%";
    document.getElementById("hinweis").textContent = laeuft
      ? (s.hint || ("Abstimmen: " + s.options.map((o, i) => i + 1).join(", ") + " in den Chat schreiben"))
      : "Ergebnis · " + s.total + (s.total === 1 ? " Stimme" : " Stimmen");
  };
</script>
</body>
</html>
