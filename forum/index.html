<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gibeon-Forum – Gibeon OS</title>
<meta name="description" content="Das Forum zu Gibeon OS: Fragen, Hilfe, Ideen und Fehlermeldungen.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>(function(){try{var d=localStorage.getItem("creative-design");if(d==="porzellan")document.documentElement.setAttribute("data-design","porzellan");}catch(e){}})();</script>
<style>
:root{
  --ground:#12151b; --surface:#1a1e27; --raised:#232836; --alt:#1d2230; --track:#3a4252;
  --text:#dce6ff; --muted:rgba(220,230,255,.64); --faint:rgba(220,230,255,.42);
  --accent:#8fb3ff; --accent-text:#12151b; --flame:#ffb07a; --ok:#6fdcc0;
  --line:rgba(255,255,255,.07); --hover:rgba(255,255,255,.04); --soft:rgba(143,179,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
}
html[data-design="porzellan"]{
  --ground:#eef1f6; --surface:#ffffff; --raised:#f3f5f9; --alt:#f8f9fc; --track:#d5dae3;
  --text:#1a2030; --muted:rgba(26,32,48,.66); --faint:rgba(26,32,48,.45);
  --accent:#3d6fe0; --accent-text:#fff; --flame:#c96a22; --ok:#1f9b7d;
  --line:rgba(0,0,0,.07); --hover:rgba(0,0,0,.025); --soft:rgba(61,111,224,.1);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(20,30,60,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14.5px/1.55 Arial,"Liberation Sans",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.wrap{width:min(1200px,calc(100% - 32px));margin:0 auto}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.demo{background:var(--flame);color:#12151b;text-align:center;font-size:12.5px;font-weight:700;padding:5px}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:22px;height:64px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;color:var(--text)}
.brand:hover{text-decoration:none}
.brand .logo{width:36px;height:36px;border-radius:11px;background:#8fb3ff;display:grid;place-items:center}
.brand .logo svg{width:23px;height:23px}
.brand small{display:none}
.navbar{display:contents}
.navbar .wrap{display:contents}
.navbar a{white-space:nowrap;padding:7px 11px;border-radius:9px;color:var(--muted);font-weight:700;font-size:14px}
.navbar a.on{color:var(--text);background:var(--raised)}
.navbar a:hover{text-decoration:none;color:var(--text);background:var(--hover)}
.navbar .s{margin-left:auto;display:flex;align-items:center}
.navbar input{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:13.5px;width:190px;outline:none}
.top .right{display:flex;align-items:center;gap:10px;font-size:13.5px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--text);background:var(--raised);transition:transform .1s,background .1s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn.primary:hover{transform:translateY(-1px);filter:brightness(1.07)}
.crumbs{margin:22px 0 12px;font-size:13px;color:var(--faint)}
.crumbs b{color:var(--text)}
.notice{background:linear-gradient(120deg,var(--soft),transparent 70%),var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.notice b{font-size:17px;display:block;margin-bottom:2px}
.block{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px;background:var(--surface);box-shadow:var(--shadow)}
.bhead{padding:14px 18px 10px;font-weight:700;font-size:15.5px;display:flex;align-items:baseline;gap:8px}
.bhead small{font-weight:400;color:var(--faint);font-size:13px}
.cols{display:grid;font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.cols div{padding:0 18px 8px}
.row{display:grid;border-top:1px solid var(--line);align-items:center;transition:background .1s}
.cols + .row{border-top:0}
.row:hover{background:var(--hover)}
.row > div{padding:14px 18px}
.g-forum{grid-template-columns:66px 1fr 74px 74px 260px}
.g-thread{grid-template-columns:58px 1fr 80px 80px 200px}
.g-forum>div:first-child,.g-thread>div:first-child{padding-right:0}
.ficon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#12151b}
.ficon svg{width:21px;height:21px}
.ficon.old{opacity:.5}
.ftitle a{font-weight:700;font-size:15px;color:var(--text)}
.fdesc{font-size:13px;color:var(--muted)}
.subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.subs a{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--raised);color:var(--muted)}
.subs a:hover{text-decoration:none;color:var(--text)}
.num{text-align:center;color:var(--muted);font-size:13px}
.num b{display:block;color:var(--text);font-size:15px}
.last{font-size:12.5px;color:var(--faint);display:flex;gap:10px;align-items:center}
.mini{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#12151b;flex:none}
.last a{font-weight:700;color:var(--text)}
.prefix{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#12151b;margin-right:6px;vertical-align:1px}
.sticky{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--flame) 20%,transparent);color:var(--flame);margin-right:6px;vertical-align:1px}
.tmeta{font-size:12.5px;color:var(--faint);margin-top:2px}
.pages{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--faint)}
.pages span{min-width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--surface);border:1px solid var(--line);padding:0 8px}
.pages span.on{background:var(--accent);color:var(--accent-text);border-color:transparent;font-weight:700}
.tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tools .pages{margin-left:auto}
.post{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;background:var(--surface);box-shadow:var(--shadow)}
.phead{display:none}
.pbody{display:grid;grid-template-columns:200px 1fr}
.pbit{padding:20px 16px;border-right:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center}
.pbit .bigava{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:700;color:#12151b;margin:0 auto 10px;box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--line)}
.pbit .uname{font-weight:700;font-size:15px;color:var(--text)}
.pbit .rank{display:inline-block;font-size:11.5px;font-weight:700;margin:4px 0 10px;padding:2px 9px;border-radius:999px;background:var(--raised)}
.pbit .rank.team{background:color-mix(in srgb,var(--flame) 22%,transparent);color:var(--flame)}
.pbit .stars{display:none}
.pbit dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:center}
.pbit dl > div{background:var(--raised);border-radius:10px;padding:6px 4px}
.pbit dt{color:var(--faint);font-size:11px}
.pbit dd{margin:0;color:var(--text);font-weight:700}
.ptext{padding:18px 22px;font-size:15px;display:flex;flex-direction:column}
.ptext .when{display:flex;font-size:12.5px;color:var(--faint);margin-bottom:10px}
.ptext .when span{margin-left:auto}
.ptext .title{font-weight:700;margin-bottom:10px;font-size:19px;letter-spacing:-.2px}
.ptext code{background:var(--raised);padding:1px 7px;border-radius:6px;font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:13px}
.quote{border-left:3px solid var(--accent);background:var(--soft);border-radius:0 12px 12px 0;padding:10px 14px;margin:0 0 12px;font-size:14px}
.quote b{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.sig{margin-top:auto;padding-top:14px;font-size:12.5px;color:var(--faint)}
.pfoot{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.pfoot .btn{height:30px;font-size:12.5px;padding:0 11px;background:transparent}
.pfoot .btn:hover{background:var(--raised)}
.pfoot .like{margin-left:auto}
.pfoot .mod{color:var(--flame)}
.compose{padding:0 18px 18px}
.compose textarea,.compose input,.compose select{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;padding:12px;outline:none}
.compose textarea:focus,.compose input:focus{border-color:var(--accent)}
.compose textarea{min-height:130px;resize:vertical}
.ed{display:flex;gap:4px;margin-bottom:8px}
.ed span{width:32px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--raised);font-weight:700;font-size:12.5px;color:var(--muted)}
.compose .act{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--faint)}
.compose .act .btn{margin-left:auto}
.layout{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start}
.side .block{padding-bottom:6px}
.stat{padding:4px 18px 14px;font-size:13.5px;color:var(--muted)}
.stat b{color:var(--text)}
.online{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 14px}
.online span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#12151b;position:relative}
.online span::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 14px}
.kv div{background:var(--raised);border-radius:12px;padding:10px 12px}
.kv b{display:block;font-size:19px}
.kv small{color:var(--faint);font-size:12px}
footer{border-top:1px solid var(--line);margin-top:20px;padding:20px 0 34px;color:var(--faint);font-size:12.5px}
footer a{margin-right:14px;color:var(--muted)}
@media (max-width:900px){.layout{grid-template-columns:1fr}.navbar a:not(.on){display:none}.navbar .s{display:none}}
@media (max-width:760px){
  .g-forum,.g-thread{grid-template-columns:58px 1fr}.g-forum>:nth-child(n+3),.g-thread>:nth-child(n+3){display:none}
  .pbody{grid-template-columns:1fr}.pbit{border-right:0;border-bottom:1px solid var(--line)}}

.msg{padding:40px 20px;text-align:center;color:var(--muted)}
.err{background:color-mix(in srgb,#e0634f 16%,var(--surface));border:1px solid color-mix(in srgb,#e0634f 40%,transparent);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:13.5px}
.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:13.5px}
.modbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;margin-bottom:12px;border:1px dashed color-mix(in srgb,var(--flame) 50%,transparent);border-radius:12px;font-size:12.5px;color:var(--flame)}
.modbar .btn{height:30px;font-size:12.5px}
.modbar select{height:30px;border-radius:9px;background:var(--raised);color:var(--text);border:1px solid var(--line);font:inherit;font-size:12.5px}
.gone{color:var(--faint);font-style:italic}
.hidden-post{opacity:.55}
.pages a{min-width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--surface);border:1px solid var(--line);padding:0 8px;color:var(--text)}
.pages a:hover{text-decoration:none;background:var(--hover)}
.ptext .body a{word-break:break-all}
.prose{padding:0 18px 18px;color:var(--muted);font-size:14px}
.prose h3{color:var(--text);font-size:15px;margin:16px 0 4px}
.liked{color:var(--accent)!important;border-color:color-mix(in srgb,var(--accent) 40%,transparent)!important}
</style>
</head>

<script>
// Gibeon-Forum – Webseite. Alle Daten kommen vom Forum-Helfer (Cloudflare Worker).
const API = "__API__";
const SEITE = location.origin + location.pathname;
const PRO_SEITE_THEMEN = 30, PRO_SEITE_BEITRAEGE = 20;
const COL = ["#8fb3ff", "#ffb07a", "#6fdcc0", "#c9a6ff", "#f2d36b", "#ff9a8a"];
let daten = null, sitzung = null, hinweis = null;

// ---------- Speicher (kann im privaten Modus fehlen)
const speicher = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
sitzung = speicher.get("gibeon-forum-sitzung");

// Rückkehr von der GitHub-Anmeldung
(function () {
  const h = location.hash;
  if (h.startsWith("#sitzung=")) { sitzung = h.slice(9); speicher.set("gibeon-forum-sitzung", sitzung); hinweis = { ok: "Du bist angemeldet." }; }
  else if (h.startsWith("#fehler=")) hinweis = { err: decodeURIComponent(h.slice(8)) };
  else return;
  const ziel = speicher.get("gibeon-forum-ziel") || "#/";
  speicher.set("gibeon-forum-ziel", null);
  history.replaceState(null, "", SEITE + ziel);
})();

// ---------- Hilfen
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmt(text) {
  let s = esc(text);
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  s = s.replace(/\bhttps?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)]/g, (u) => `<a href="${u}" target="_blank" rel="nofollow noopener noreferrer ugc">${u}</a>`);
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  return s.replace(/\n/g, "<br>");
}
const col = (n) => COL[[...String(n || "?")].reduce((a, c) => a + c.charCodeAt(0), 0) % COL.length];
const ava = (n, cls = "mini") => `<span class="${cls}" style="background:${n ? col(n) : "var(--track)"}">${n ? esc(n[0].toUpperCase()) : "?"}</span>`;
function wann(iso) {
  const d = new Date(iso), jetzt = new Date();
  const uhr = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const tag = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = (tag(jetzt) - tag(d)) / 86400e3;
  if (diff === 0) return "Heute, " + uhr;
  if (diff === 1) return "Gestern, " + uhr;
  return d.toLocaleDateString("de-DE") + ", " + uhr;
}
function rang(info) {
  if (info?.team) return ["Entwickler", "team"];
  const n = info?.beitraege || 0;
  return [n < 5 ? "Neuling" : n < 25 ? "Mitglied" : n < 100 ? "Stammgast" : "Urgestein", ""];
}
const ich = () => daten?.ich || null;
const admin = () => !!ich()?.admin;
const alleForen = () => (daten?.foren?.bereiche || []).flatMap((b) => b.foren);
const forumVon = (id) => alleForen().find((f) => f.id === id);

async function api(pfad, body) {
  const r = await fetch(API + pfad, {
    method: body ? "POST" : "GET",
    headers: { ...(sitzung ? { Authorization: "Bearer " + sitzung } : {}), ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && sitzung) { sitzung = null; speicher.set("gibeon-forum-sitzung", null); }
  if (!r.ok) throw new Error(j.fehler || "Fehler " + r.status);
  return j;
}
function anmelden() {
  speicher.set("gibeon-forum-ziel", location.hash || "#/");
  location.href = API + "/login?zurueck=" + encodeURIComponent(SEITE);
}
